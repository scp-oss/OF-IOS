name: OpenFlux
options:
  bundleIdPrefix: com.p1neapplexpress-saharev
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "36"
    DEVELOPMENT_TEAM: "8GQH8GQ252"

# Interface-only preview build: no OpenFluxTunnel target, no Network
# Extension entitlement — signs and installs on a real iPhone with a free
# personal-team Apple ID (no paid Developer Program needed). Tapping
# "Start VPN" will fail with an on-screen error (no extension to talk to) —
# expected, everything else (profiles, sheets, log, "Проверить доступность")
# works normally. Still needs a REAL iPhone, not the Simulator — liboflux.a
# is built for iPhoneOS/arm64 only, unrelated to this entitlement.
#
# Generate with: xcodegen generate --spec project.preview.yml
# The real project.yml (full app, with the extension, for whoever has a
# paid account to sign it) is untouched by this file.
targets:
  OpenFlux:
    type: application
    platform: iOS
    sources:
      - path: OpenFlux
      - path: Lib
        buildPhase: none
    dependencies:
      - framework: Lib/liboflux.a
        embed: false
    info:
      path: OpenFlux/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p1neapplexpress-saharev.openflux.preview
        PRODUCT_NAME: OpenFlux
        INFOPLIST_KEY_CFBundleDisplayName: OpenFlux Preview
        SWIFT_OBJC_BRIDGING_HEADER: OpenFlux/OpenFlux-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Lib"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Lib"
        OTHER_LDFLAGS:
          - "-lresolv"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "Security"
        CODE_SIGN_STYLE: Automatic
